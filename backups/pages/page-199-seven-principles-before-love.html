<figure class="wp-block-image aligncenter size-full"><img src="http://localhost:8080/wp-content/uploads/2026/09/Seven_principles.jpg" alt="Originally, we were united by our belief in Seven Principles. Unitarian Universalist congregations affirm and promote these Seven Principles: 1. Honor the inherent worth and dignity of every person. 2. Practice justice, equity, and compassion in human relations. 3. Accept one another and encourage spiritual growth. 4. Support the freedom to search for what is true and right in life. 5. Ensure all have a vote about matters that concern them. 6. Work for a peaceful, fair, and free world. 7. Care for planet Earth, the home we share with all living things." class="wp-image-957"/></figure>
