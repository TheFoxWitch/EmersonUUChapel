services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  wordpress:
    depends_on:
      - db
    build: .
    image: emerson-wordpress:7.1.4-php8.2-apache-calendar
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      EMERSON_MARKETING_SMTP_HOST: ${EMERSON_MARKETING_SMTP_HOST:-netsol-smtp-oxcs.hostingplatform.com}
      EMERSON_MARKETING_SMTP_PORT: ${EMERSON_MARKETING_SMTP_PORT:-587}
      EMERSON_MARKETING_SMTP_USER: ${EMERSON_MARKETING_SMTP_USER:-}
      EMERSON_MARKETING_SMTP_PASS: ${EMERSON_MARKETING_SMTP_PASS:-}
      EMERSON_MARKETING_FROM_EMAIL: ${EMERSON_MARKETING_FROM_EMAIL:-marketing@emersonuuchapel.org}
      EMERSON_MARKETING_FROM_NAME: ${EMERSON_MARKETING_FROM_NAME:-Emerson UU Chapel}
      EMERSON_GOOGLE_SHEETS_API_KEY: ${EMERSON_GOOGLE_SHEETS_API_KEY:-}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./localfiles:/var/www/html/localfiles
      - ./private-files:/var/emerson-private
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wpcli:
    depends_on:
      - db
      - wordpress
    image: wordpress:cli-php8.2
    user: "33:33"
    volumes:
      - wp_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./localfiles:/var/www/html/localfiles
      - ./private-files:/var/emerson-private
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      EMERSON_MARKETING_SMTP_HOST: ${EMERSON_MARKETING_SMTP_HOST:-netsol-smtp-oxcs.hostingplatform.com}
      EMERSON_MARKETING_SMTP_PORT: ${EMERSON_MARKETING_SMTP_PORT:-587}
      EMERSON_MARKETING_SMTP_USER: ${EMERSON_MARKETING_SMTP_USER:-}
      EMERSON_MARKETING_SMTP_PASS: ${EMERSON_MARKETING_SMTP_PASS:-}
      EMERSON_MARKETING_FROM_EMAIL: ${EMERSON_MARKETING_FROM_EMAIL:-marketing@emersonuuchapel.org}
      EMERSON_MARKETING_FROM_NAME: ${EMERSON_MARKETING_FROM_NAME:-Emerson UU Chapel}
      EMERSON_GOOGLE_SHEETS_API_KEY: ${EMERSON_GOOGLE_SHEETS_API_KEY:-}

    entrypoint: wp
    command: "--info"

volumes:
  db_data:
  wp_core:
